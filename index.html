<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060914">
<title>HALO LINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:ital,wght@0,500;0,700;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css?v=0.3">
</head>
<body data-scr="title">

<!-- ===== タイトル ===== -->
<section class="scr on" id="title">
  <div class="t-bg"></div>
  <div class="t-logo"><span>HALO</span><b>LINK</b><small>CARD BATTLE</small></div>
  <div class="t-load"><i id="tBar"></i></div>
  <p class="t-start" id="tStart">TAP TO START</p>
</section>

<!-- ===== ホーム ===== -->
<section class="scr" id="home">
  <div class="h-bg" id="hBg"></div>
  <img class="h-char" id="hChar" alt="">
  <div class="h-top in">
    <div class="h-name" id="hName"></div>
    <div class="h-aff" id="hAff"></div>
  </div>
  <div class="h-talk" id="hTalk"><p></p></div>
  <div class="h-side in">
    <button class="h-pack" id="hPack"><span>PACK</span><b id="hPackN">0</b></button>
  </div>
  <button class="h-go in" id="hGo"><small>NEXT STAGE</small><b id="hNext"></b><span>出撃</span></button>
</section>

<!-- ===== 作戦 ===== -->
<section class="scr" id="stage">
  <div class="sc-bg" style="background-image:url(bg_sand.webp)"></div>
  <header class="hd in"><div><em>OPERATION</em><b>作戦</b></div><div class="res"><span>記章</span><b id="stBadge">0</b><span>券</span><b data-hud="ticket">0</b></div></header>
  <div class="st-scroll">
    <div class="st-diff in" id="stDiff"></div>
    <div class="st-info in" id="stInfo"></div>
    <p class="lab in">TEAM<button class="mini" id="stEdit">編成を変える</button></p>
    <div class="st-party in" id="stParty"></div>
    <div class="st-act in"><button class="btn main big" id="stGo"></button><button class="btn sub" id="stSweep">掃討</button></div>
    <p class="lab in">PASSIVE<small>記章で永続の特性を解放</small></p>
    <div class="st-pass in" id="stPass"></div>
  </div>
</section>

<!-- ===== マップ ===== -->
<section class="scr" id="map">
  <div class="sc-bg" style="background-image:url(bg_sand.webp)"></div>
  <header class="hd"><div><em>MAP</em><b id="mDiff"></b></div><div class="res"><span>記章</span><b id="mBadge">0</b></div></header>
  <div class="m-party" id="mParty"></div>
  <div class="m-map" id="mMap"></div>
  <div class="m-bar"><button class="btn sub" id="mDeckBtn">デッキ <b id="mDeck">0</b>枚</button><button class="btn sub" id="mSettle">精算して終わる</button></div>
</section>

<!-- ===== パック ===== -->
<section class="scr" id="pack">
  <div class="sc-bg" style="background-image:url(bg_gacha.webp)"></div>
  <header class="hd in"><div><em>BOOSTER</em><b>パック</b></div><div class="res"><span>券</span><b data-hud="ticket">0</b><span>PT</span><b data-hud="pt">0</b></div></header>
  <div class="pk-view in" id="pkView"></div>
  <p class="pk-rate in" id="pkRate"></p>
  <div class="pk-act in">
    <button class="btn main big" id="pkOpen"><b>開封する</b><small></small></button>
    <p class="pk-timer" id="pkTimer"></p>
  </div>
</section>

<!-- ===== 編成 ===== -->
<section class="scr" id="deck">
  <div class="sc-bg dark" style="background-image:url(bg_home.webp)"></div>
  <header class="hd in"><div><em>TEAM</em><b>編成</b></div></header>
  <div class="dk-scroll">
    <p class="lab in">TEAM<small>枠をタップ → 下から入れる子を選ぶ。左が前列（攻撃を受ける）</small></p>
    <div class="dk-team in" id="dkTeam"></div>
    <div class="dk-syn in" id="dkSyn"></div>
    <p class="lab in">MEMBERS</p>
    <div class="dk-pool in" id="dkPool"></div>
    <p class="lab in">START DECK<small>この3人のカードで始まり、戦闘の報酬で増えていく</small></p>
    <div class="dk-own" id="dkStart"></div>
  </div>
</section>

<!-- ===== 図鑑 ===== -->
<section class="scr" id="book">
  <div class="sc-bg dark" style="background-image:url(bg_gacha.webp)"></div>
  <header class="hd in"><div><em>COLLECTION</em><b>カード図鑑</b></div><div class="bk-rate" id="bkRate"></div></header>
  <div class="tabs in" id="bkTabs"></div>
  <div class="bk-grid" id="bkGrid"></div>
</section>

<!-- ===== バトル ===== -->
<section class="scr" id="battle">
  <div class="b-field" id="bField">
    <div class="b-bg"></div>
    <div class="b-head">
      <button class="mini" id="bRetreat">撤退</button>
      <span class="b-stage" id="bStage"></span>
      <span class="b-wave">WAVE <b id="bWave">1/1</b></span>
    </div>
    <div id="bEnemies"></div>
    <div class="b-syn" id="bSyn"></div>
    <div class="b-party" id="bParty"></div>
    <div class="b-me">
      <div class="b-block" id="bBlock"><svg viewBox="0 0 24 24"><path d="M12 2l9 3v6c0 6-4 10-9 11C7 21 3 17 3 11V5z"/></svg><b>0</b></div>
      <div class="b-chain" id="bChain"></div>
      <div class="b-st" id="bSt"></div>
    </div>
    <div id="bBanner"></div>
    <div id="bTurn"></div>
    <div id="bFlash"></div>
  </div>
  <div class="b-bar">
    <div class="b-energy" id="bEnergy"><b>3</b><small>/3</small></div>
    <button class="b-pile" id="bPileD"><i>山札</i><b id="bDraw">0</b></button>
    <button class="b-pile" id="bPileX"><i>捨て札</i><b id="bDisc">0</b></button>
    <button class="b-end" id="bEnd">ターン終了</button>
  </div>
  <div id="hand"></div>
  <div id="preview"></div>
</section>

<!-- 重ねて出すもの -->
<div id="cut"><div class="c-bg"></div><i class="c-s1"></i><i class="c-s2"></i><div class="c-art"><img alt=""></div>
  <div class="c-txt"><span class="cn"></span><b class="cs"></b><p class="cd"></p></div></div>
<div id="rv"></div>
<div id="po"></div>
<div id="imm"></div>
<div id="detail"></div>
<div id="lobbyView"></div>
<div id="over"></div>
<div id="toast"></div>

<nav id="nav" class="hide">
  <button data-go="home"><i class="ic i-home"></i>ホーム</button>
  <button data-go="stage"><i class="ic i-stage"></i>作戦</button>
  <button data-go="pack"><i class="ic i-pack"></i>パック<em id="navBadge"></em></button>
  <button data-go="deck"><i class="ic i-deck"></i>編成</button>
  <button data-go="book"><i class="ic i-book"></i>図鑑</button>
</nav>

<script src="data.js?v=0.3"></script>
<script src="save.js?v=0.3"></script>
<script src="sfx.js?v=0.3"></script>
<script src="card.js?v=0.3"></script>
<script src="battle.js?v=0.3"></script>
<script src="pack.js?v=0.3"></script>
<script src="run.js?v=0.3"></script>
<script src="ui.js?v=0.3"></script>
</body>
</html>
