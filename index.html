:root{
  --teal:#20999C; --teal-dark:#006A6B; --teal-light:#82CBCC;
  --teal-wash:rgba(32,153,156,.07); --teal-wash2:rgba(32,153,156,.12); --teal-line:rgba(32,153,156,0.28);
  --lime:#9BBA29; --lime-wash:rgba(155,186,41,0.12);
  --blue:#04659F; --blue-wash:rgba(4,101,159,0.10);
  --coral:#DD7E6F; --coral-wash:rgba(221,126,111,0.12);
  --white:#FFFFFF; --bg:#FFFFFF; --card:#FFFFFF; --card2:#F6F8F8;
  --ink:#000000; --ink-dim:#595757; --ink-faint:#9AA3A3;
  --line:#E3E3E3; --line2:#EDF2F2;
  --pos:var(--teal-dark); --neg:var(--coral);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px -10px rgba(0,106,107,.18); --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --r:4px; --r-sm:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;-webkit-font-smoothing:antialiased;font-size:14.5px;line-height:1.6;}
body{padding-bottom:env(safe-area-inset-bottom);}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:9px;}
.brand .logo{width:30px;height:30px;border-radius:50%;background:var(--teal-dark);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.brand .logo img{width:100%;height:100%;object-fit:cover;display:block;}
.brand .logo svg{width:17px;height:17px;stroke:#fff;}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:0;color:var(--teal-dark);}
.gearbtn{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--white);color:var(--ink-dim);font-size:16px;cursor:pointer;}
.gearbtn:active{background:var(--card2);}
main{flex:1;padding:12px 14px 88px;}
.view{display:none;}
.view.active{display:block;}
.card{background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.card h2{font-size:11px;margin:0 0 11px;color:var(--teal-dark);letter-spacing:.04em;font-weight:700;}
.card h2 .sub{color:var(--ink-faint);font-weight:500;letter-spacing:0;font-size:11px;margin-left:6px;}
/* 月ヘッダ */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;padding:0 2px;}
.monthbar .mv{font-size:17px;font-weight:700;color:var(--ink);}
.mnav{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--white);color:var(--teal-dark);font-size:16px;cursor:pointer;}
.mnav:active{background:var(--card2);}
/* 月サマリー */
.msum{background:var(--teal-dark);border-radius:var(--r);padding:16px 17px;margin-bottom:12px;}
.msum .mlab{font-size:11px;color:rgba(255,255,255,.72);font-weight:600;letter-spacing:.02em;}
.msum .mbig{font-size:30px;font-weight:700;letter-spacing:0;margin:4px 0 0;line-height:1.15;color:#fff;}
.msum .mbig .yen{font-size:16px;opacity:.65;margin-right:2px;}
.msum .mbig.plus{color:#fff;} .msum .mbig.minus{color:#ffd9d2;}
.msum .mrow{display:flex;gap:9px;margin-top:13px;}
.msum .mrow .mi{flex:1;background:rgba(255,255,255,.1);border-radius:var(--r-sm);padding:9px 11px;}
.msum .mrow .mi .k{font-size:10px;color:rgba(255,255,255,.68);font-weight:600;}
.msum .mrow .mi .v{font-size:15px;font-weight:700;margin-top:2px;color:#fff;}
.msum .mrow .mi .v.in{color:#c8f0e0;} .msum .mrow .mi .v.out{color:#ffd9d2;}
.msum .mrow .mi .v .yen{font-size:10px;opacity:.7;}
/* カレンダー */
.calcard{padding:12px 10px;overflow:hidden;}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%;box-sizing:border-box;}
.calgrid .wd{text-align:center;font-size:10px;color:var(--ink-faint);padding:2px 0 5px;font-weight:600;}
.cell{height:38px;min-width:0;width:100%;border-radius:var(--r-sm);background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;position:relative;cursor:pointer;border:1.5px solid transparent;font-weight:500;color:var(--ink);box-sizing:border-box;}
.cell.empty{background:transparent;cursor:default;}
.cell.today{background:var(--teal-wash2);color:var(--teal-dark);font-weight:700;}
.cell.sel{border-color:var(--teal-dark);background:var(--teal-wash2);}
.cell .mk{display:flex;gap:2px;margin-top:2px;height:4px;align-items:center;}
.cell .mk i{width:4px;height:4px;border-radius:50%;display:block;}
.cell .mk i.in{background:var(--teal);} .cell .mk i.out{background:var(--coral);}
.cell.sun{color:var(--coral);} .cell.sat{color:var(--blue);}
.cell.sun.today,.cell.sat.today{color:var(--teal-dark);}
/* 選択日明細 */
.daybar{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px;}
.daybar .d{font-size:14.5px;font-weight:700;color:var(--ink);}
.daybar .dn{font-size:12.5px;font-weight:600;}
.txrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2);}
.txrow:last-child{border-bottom:none;}
.txic{width:36px;height:36px;border-radius:var(--r-sm);flex:none;display:flex;align-items:center;justify-content:center;}
.txic svg{width:19px;height:19px;}
.txrow .nm{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--ink);}
.txrow .nm small{display:block;color:var(--ink-faint);font-size:11px;font-weight:400;margin-top:1px;}
.txrow .amt{font-weight:700;font-size:14px;white-space:nowrap;letter-spacing:0;}
.txrow .amt.in{color:var(--teal-dark);} .txrow .amt.out{color:var(--ink);}
.empty{color:var(--ink-faint);font-size:12.5px;text-align:center;padding:20px 0;}
/* FAB */
.fab{position:fixed;bottom:80px;right:calc(50% - 246px);width:52px;height:52px;border-radius:14px;border:none;
  background:var(--teal-dark);color:#fff;font-size:26px;cursor:pointer;z-index:25;
  box-shadow:0 4px 14px rgba(0,106,107,.35);display:flex;align-items:center;justify-content:center;}
.fab:active{transform:scale(.94);}
@media(max-width:520px){.fab{right:16px;}}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);display:flex;max-width:520px;margin:0 auto;}
nav button{flex:1;background:none;border:none;color:var(--ink-faint);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 0;font-weight:500;}
nav button .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
nav button .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;}
nav button.active{color:var(--teal-dark);font-weight:700;}
/* modal & sheet */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);}
.modal.open{display:flex;}
.sheet{background:var(--white);border-radius:14px 14px 0 0;width:100%;max-width:520px;
  padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -6px 24px rgba(0,0,0,.14);max-height:92vh;overflow-y:auto;}
.sheet .grip{width:34px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px;}
.sheet h3{margin:0 0 16px;font-size:16px;color:var(--ink);font-weight:700;text-align:center;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;color:var(--ink-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1.5px solid var(--line);color:var(--ink);padding:12px;border-radius:var(--r-sm);font-size:16px;font-family:inherit;font-weight:400;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);background:#fff;}
.field input::placeholder{color:var(--ink-faint);font-weight:400;}
/* 支出収入トグル */
.segbig{display:flex;gap:0;background:var(--card2);border-radius:var(--r-sm);padding:3px;margin-bottom:16px;}
.segbig button{flex:1;padding:10px;border-radius:5px;border:none;background:none;color:var(--ink-dim);font-size:14px;font-weight:700;cursor:pointer;}
.segbig button.on{background:#fff;box-shadow:var(--shadow-sm);}
.segbig button.on.exp{color:var(--coral);} .segbig button.on.inc{color:var(--teal-dark);}
/* 金額ディスプレイ */
.amtdisp{background:var(--teal-dark);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:14px;display:flex;align-items:baseline;justify-content:flex-end;gap:5px;}
.amtdisp .yen{color:rgba(255,255,255,.6);font-size:16px;font-weight:600;}
.amtdisp .n{color:#fff;font-size:30px;font-weight:700;letter-spacing:0;line-height:1;}
.amtdisp .n.ph{color:rgba(255,255,255,.35);}
/* カテゴリタイル */
.cattiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:6px;max-height:220px;overflow-y:auto;padding:2px;}
.cattile{background:var(--card2);border:1.5px solid transparent;border-radius:var(--r-sm);padding:10px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.cattile.on{border-color:var(--teal-dark);background:var(--teal-wash);}
.cattile .ci{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.cattile .ci svg{width:22px;height:22px;}
.cattile .cn{font-size:10px;color:var(--ink-dim);font-weight:600;text-align:center;line-height:1.2;}
.cattile.on .cn{color:var(--teal-dark);}
.cattile.add .ci{color:var(--ink-faint);font-size:20px;}
/* 電卓 */
.calcpad{margin-top:4px;}
.calctax{display:flex;gap:7px;margin-bottom:9px;justify-content:flex-end;}
.calctax button{padding:7px 12px;border-radius:20px;border:1.5px solid var(--lime);background:var(--lime-wash);color:#6b8016;font-size:11.5px;font-weight:700;cursor:pointer;}
.calctax button:active{background:var(--lime);color:#fff;}
.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.calcgrid button{padding:15px 0;border-radius:var(--r-sm);border:none;font-size:18px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--ink);}
.calcgrid button:active{background:var(--line);}
.calcgrid button.op{background:var(--teal-wash);color:var(--teal-dark);font-weight:700;}
.calcgrid button.fn{background:var(--coral-wash);color:var(--coral);font-weight:700;font-size:14px;}
.calcgrid button.ok{background:var(--teal-dark);color:#fff;grid-row:span 2;font-size:16px;font-weight:700;}
.calcgrid button.zero{grid-column:span 2;}
.calceq{font-size:11.5px;color:var(--ink-faint);text-align:right;min-height:16px;margin:7px 4px 0;font-weight:500;}
.calceq b{color:var(--teal-dark);}
/* 汎用ボタン */
.btn{display:block;width:100%;padding:13px;border-radius:var(--r-sm);border:none;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:9px;}
.btn.primary{background:var(--teal-dark);color:#fff;}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:#fff;color:var(--coral);border:1.5px solid var(--coral-wash);}
.sheetbtns{display:flex;gap:9px;margin-top:6px;}
.sheetbtns button{flex:1;padding:13px;border-radius:var(--r-sm);font-size:14px;font-weight:700;border:none;cursor:pointer;}
.sheetbtns .save{background:var(--teal-dark);color:#fff;}
.sheetbtns .cancel{background:var(--card2);color:var(--ink-dim);}
.datepick{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:var(--r-sm);padding:5px;margin-bottom:14px;}
.datepick button{width:38px;height:38px;border-radius:var(--r-sm);border:none;background:#fff;color:var(--teal-dark);font-size:16px;cursor:pointer;box-shadow:var(--shadow-sm);}
.datepick .dv{font-size:13.5px;font-weight:700;color:var(--ink);}
.iconbtn{background:var(--card2);border:none;color:var(--ink-dim);width:32px;height:32px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;flex:none;}
.iconbtn:active{background:var(--line);}
.tag{font-size:9.5px;padding:2px 8px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block;}
/* 遊びの予定 */
.asobisum{background:var(--teal-dark);border-radius:var(--r);padding:17px;margin-bottom:14px;color:#fff;}
.asobisum .k{font-size:11px;opacity:.75;font-weight:600;}
.asobisum .v{font-size:27px;font-weight:700;margin-top:4px;letter-spacing:0;}
.asobisum .v .yen{font-size:15px;opacity:.65;}
.asobisum .sub{font-size:11.5px;opacity:.85;margin-top:5px;}
.plan{display:flex;gap:11px;padding:13px;background:var(--card);border-radius:var(--r);margin-bottom:9px;box-shadow:var(--shadow-sm);border:1px solid var(--line);align-items:center;}
.plan.done{opacity:.55;}
.plan .pd{width:46px;height:46px;border-radius:var(--r-sm);background:var(--teal-wash);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--teal-dark);}
.plan .pd .mo{font-size:9px;font-weight:700;line-height:1;} .plan .pd .dy{font-size:17px;font-weight:700;line-height:1.1;}
.plan.done .pd{background:var(--card2);color:var(--ink-faint);}
.plan .pi{flex:1;min-width:0;}
.plan .pi .pt{font-size:14px;font-weight:700;color:var(--ink);}
.plan.done .pi .pt{text-decoration:line-through;}
.plan .pi .pm{font-size:11px;color:var(--ink-dim);margin-top:2px;font-weight:400;}
.plan .pi .pm span{margin-right:9px;}
.plan .pr{text-align:right;flex:none;}
.plan .pr .pv{font-size:14.5px;font-weight:700;color:var(--teal-dark);white-space:nowrap;}
.plan .pr .pchk{margin-top:6px;width:23px;height:23px;border-radius:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;margin-left:auto;}
.plan.done .pr .pchk{background:var(--teal-dark);border-color:var(--teal-dark);}
/* todo */
.todoitem{display:flex;align-items:center;gap:11px;padding:13px;background:var(--card);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.todoitem.done{opacity:.5;}
.todock{width:23px;height:23px;border-radius:6px;border:1.5px solid var(--line);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff;}
.todock.on{background:var(--teal-dark);border-color:var(--teal-dark);}
.todoitem .tt{flex:1;font-size:14px;font-weight:500;color:var(--ink);}
.todoitem.done .tt{text-decoration:line-through;color:var(--ink-faint);}
.todoadd{display:flex;gap:8px;margin-bottom:14px;}
.todoadd input{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px;font-size:14px;font-weight:400;font-family:inherit;}
.todoadd input:focus{outline:none;border-color:var(--teal);}
.todoadd button{width:46px;border-radius:var(--r-sm);border:none;background:var(--teal-dark);color:#fff;font-size:22px;cursor:pointer;}
.todoadd button:active{transform:scale(.94);}
/* account */
.aslot{display:flex;align-items:center;gap:11px;padding:13px;background:var(--card);border-radius:var(--r);margin-bottom:9px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.aslot .athumb{width:40px;height:40px;border-radius:var(--r-sm);flex:none;background:var(--teal-dark);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;}
.aslot .am{flex:1;min-width:0;} .aslot .am .at{font-size:14px;font-weight:700;color:var(--ink);} .aslot .am .ac{font-size:11px;color:var(--ink-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.aslot .aa{display:flex;gap:6px;flex:none;}
.pwmask{font-family:ui-monospace,monospace;letter-spacing:1px;}
.hint{font-size:11px;color:var(--ink-faint);line-height:1.7;margin:7px 3px 14px;}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:11px 20px;border-radius:24px;font-size:12.5px;font-weight:600;z-index:99;opacity:0;transition:opacity .3s;box-shadow:var(--shadow-lg);max-width:88%;text-align:center;}
.toast.show{opacity:1;}
.seg{display:flex;gap:7px;}
.seg button{flex:1;padding:11px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card2);color:var(--ink-dim);font-size:13px;font-weight:600;cursor:pointer;}
.seg button.on{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);}
/* 集計 */
.bkrow{display:flex;align-items:center;gap:11px;padding:9px 0;}
.bkic{width:34px;height:34px;border-radius:var(--r-sm);flex:none;display:flex;align-items:center;justify-content:center;}
.bkmid{flex:1;min-width:0;}
.bktop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.bkname{font-size:13px;font-weight:600;color:var(--ink);}
.bkamt{font-size:13.5px;font-weight:700;color:var(--ink);}
.bkbar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;}
.bkbar>i{display:block;height:100%;border-radius:4px;}
.bkpct{font-size:11px;font-weight:600;color:var(--ink-faint);width:32px;text-align:right;flex:none;}
.bktotal{display:flex;justify-content:space-between;padding-top:12px;margin-top:7px;border-top:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--ink);}
.asobicount{text-align:center;}
.acbig{display:flex;align-items:baseline;justify-content:center;gap:5px;margin:5px 0 2px;}
.acbig .acn{font-size:42px;font-weight:700;color:var(--teal-dark);line-height:1;}
.acbig .acu{font-size:17px;color:var(--ink-dim);font-weight:600;}
.acsub{font-size:12px;color:var(--ink-dim);}.acsub b{color:var(--teal-dark);font-size:13.5px;}
.acitem{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px;}
.acitem:last-child{border-bottom:none;}
.acitem .acd{color:var(--ink-faint);font-weight:600;width:40px;flex:none;text-align:left;}
.acitem .act{flex:1;text-align:left;font-weight:500;color:var(--ink);}
.acitem .acv{font-weight:700;color:var(--teal-dark);}
/* フレンド */
.friendstrip{display:flex;gap:13px;overflow-x:auto;padding:3px 2px 13px;-webkit-overflow-scrolling:touch;}
.friendstrip::-webkit-scrollbar{display:none;}
.fchip{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;cursor:pointer;width:56px;}
.favatar{border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow-sm);}
.favatar img{width:100%;height:100%;object-fit:cover;display:block;}
.fchip .fnm{font-size:10.5px;color:var(--ink-dim);font-weight:600;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
.fadd .addav{background:var(--card2);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;font-size:22px;border:1.5px dashed var(--line);box-shadow:none;}
.fselect{display:flex;flex-wrap:wrap;gap:7px;}
.fsel{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:22px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-dim);}
.fsel.on{border-color:var(--teal-dark);background:var(--teal-wash);color:var(--teal-dark);}
.fsel span{white-space:nowrap;}
.fsnone{font-size:12px;color:var(--ink-faint);line-height:1.6;}
.pfaces{display:flex;margin-top:7px;}
.pfaces .favatar{margin-right:-7px;width:22px;height:22px;border-width:1.5px;}
.pfaces .pmore{width:22px;height:22px;border-radius:50%;background:var(--card2);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--ink-dim);margin-left:2px;}
/* ===== 立体感・触覚強化 ===== */
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px -8px rgba(0,106,107,.22),0 2px 5px rgba(0,0,0,.03);transition:transform .12s,box-shadow .12s;}
.msum,.asobisum{box-shadow:0 2px 6px rgba(0,0,0,.1),0 14px 30px -10px rgba(0,80,80,.45);}
.btn:active,.sheetbtns button:active,.mnav:active,.gearbtn:active,.iconbtn:active{transform:scale(.93);filter:brightness(.96);}
.plan:active,.todoitem:active,.aslot:active,.subitem:active{transform:scale(.98);box-shadow:0 1px 2px rgba(0,0,0,.06);}
.cell{transition:transform .08s,box-shadow .08s;}
.cell:active{transform:scale(.9);}
.fab{box-shadow:0 3px 8px rgba(0,0,0,.15),0 10px 24px -6px rgba(0,106,107,.5);}
.fab:active{transform:scale(.9) rotate(-4deg);}
nav button .ic svg{transition:transform .15s cubic-bezier(.3,1.5,.4,1);}
nav button.active .ic svg{transform:scale(1.12) translateY(-1px);}
@keyframes popIn{0%{opacity:0;transform:scale(.85) translateY(6px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.pop-in{animation:popIn .28s cubic-bezier(.2,.9,.3,1.15);}

/* ===== 収支ポップアップ(食費/タバコ/日用品) ===== */
.budgetpop{background:linear-gradient(160deg,#fff,#f2fafa);border:1.5px solid var(--teal-line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,106,107,.15);}
.budgetpop .bpq{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.budgetpop .bpin{display:flex;gap:8px;margin-bottom:8px;}
.budgetpop input{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px;font-size:16px;}
.budgetpop .bpbtns{display:flex;gap:8px;}
.budgetpop button{flex:1;padding:11px;border-radius:var(--r-sm);border:none;font-size:13px;font-weight:700;cursor:pointer;}
.budgetpop .bpsave{background:var(--teal-dark);color:#fff;}
.budgetpop .bpskip{background:var(--card2);color:var(--ink-dim);}
.budgetwarn{display:flex;align-items:center;gap:10px;background:var(--coral-wash);border:1px solid rgba(221,126,111,.3);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:10px;font-size:12.5px;color:#a04a3d;font-weight:600;}
.budgetwarn .wic{width:26px;height:26px;flex:none;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;}

/* ===== 給与カウンター ===== */
.salhero{background:linear-gradient(150deg,var(--teal-dark),#005152);border-radius:var(--r);padding:22px 20px;margin-bottom:14px;color:#fff;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.15),0 16px 36px -12px rgba(0,80,80,.5);position:relative;overflow:hidden;}
.salhero::before{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);}
.salhero .sl{font-size:11.5px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.03em;z-index:1;position:relative;}
.salhero .sv{font-size:38px;font-weight:800;margin:5px 0 2px;z-index:1;position:relative;}
.salhero .sv .yen{font-size:19px;opacity:.65;}
.salhero .ssub{font-size:12px;color:rgba(255,255,255,.75);z-index:1;position:relative;}
.streak{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;z-index:1;position:relative;}
.streak .fireic{font-size:20px;}
.streak .sn{font-size:22px;font-weight:800;}
.punchbtn{width:100%;padding:18px;border-radius:var(--r);border:none;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;box-shadow:0 4px 12px rgba(0,106,107,.35);margin-top:4px;}
.punchbtn.done{background:var(--card2);color:var(--teal-dark);border:1.5px solid var(--teal-line);box-shadow:none;}
.punchbtn:active{transform:scale(.97);}
.salcal .cell.worked{background:linear-gradient(145deg,#dff5f2,#c8ebe6);color:var(--teal-dark);font-weight:800;}
.salinfo{font-size:12.5px;line-height:1.9;color:var(--ink-dim);}
.salinfo .r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);}
.salinfo .r:last-child{border-bottom:none;}
.salinfo b{color:var(--ink);font-weight:700;}

/* ===== 相棒タブ ===== */
.companionwrap{position:relative;overflow:hidden;background:#000;width:100%;height:calc(100vh - env(safe-area-inset-top) - 64px - 74px);min-height:420px;}
.companionwrap img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
.companion-dots{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3;}
.companion-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);display:block;}
.companion-dots i.on{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.7);}
.subtitle-box{position:absolute;left:10px;right:10px;bottom:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:14px;padding:12px 15px;opacity:0;transition:opacity .35s;z-index:3;}
.subtitle-box.show{opacity:1;}
.subtitle-box p{margin:0;color:#fff;font-size:14.5px;line-height:1.6;font-family:"Yumin","Hiragino Mincho ProN",serif;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.companion-hint{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.85);border-radius:20px;padding:4px 11px;font-size:10.5px;font-weight:700;color:var(--teal-dark);z-index:3;}
.companion-ask{width:100%;padding:14px;border-radius:var(--r-sm);border:none;background:var(--teal-dark);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;}
.companion-ask:active{transform:scale(.97);}
.ambient-companion{position:absolute;pointer-events:auto;cursor:pointer;z-index:5;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18));transition:transform .15s;}
.ambient-companion img{display:block;width:100%;height:auto;}
.ambient-companion:active{transform:scale(.95);}
.ambient-companion.bounce{animation:ambBounce .5s cubic-bezier(.3,1.6,.4,1);}
@keyframes ambBounce{0%{transform:scale(0.5) translateY(16px);opacity:0}60%{transform:scale(1.1) translateY(-3px);opacity:1}100%{transform:scale(1) translateY(0)}}
.ambient-layer{position:relative;width:100%;pointer-events:none;height:0;}
.ambient-layer .ambient-companion{pointer-events:auto;}
.ambient-bubble{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);max-width:240px;background:#fff;border:1.5px solid var(--teal-line);border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:12.5px;color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:40;opacity:0;transition:opacity .25s;text-align:center;}
.ambient-bubble.show{opacity:1;}

/* ===== TODO(やること/やりたいこと) ===== */
.todotabs{display:flex;gap:8px;margin-bottom:14px;background:var(--card2);border-radius:var(--r-sm);padding:4px;}
.todotabs button{flex:1;padding:10px;border-radius:6px;border:none;background:none;color:var(--ink-dim);font-size:13.5px;font-weight:700;cursor:pointer;}
.todotabs button.on{background:#fff;color:var(--teal-dark);box-shadow:var(--shadow-sm);}
.rel-avatar{border-radius:50%;}
.rel-avatar.sq{border-radius:8px;}
.wishitem{display:flex;align-items:center;gap:12px;padding:13px;background:var(--card);border-radius:var(--r);margin-bottom:9px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
.wishitem .wt{flex:1;font-size:14px;font-weight:600;color:var(--ink);}
.wishitem .wt small{display:block;color:var(--ink-faint);font-size:11px;font-weight:400;margin-top:2px;}
.wishitem .wlink{color:var(--teal-dark);font-size:11px;text-decoration:none;border:1px solid var(--teal-line);padding:4px 9px;border-radius:14px;}

/* ===== アプリtier ===== */
.tiercol{margin-bottom:12px;}
.tiercol h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:0 0 8px;padding:0 2px;}
.tiercol .tbadge{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;}
.tiercol.S .tbadge{background:var(--teal-dark);} .tiercol.A .tbadge{background:var(--teal);} .tiercol.B .tbadge{background:var(--blue);} .tiercol.C .tbadge{background:var(--ink-dim);}
.tierrow{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px;min-height:64px;-webkit-overflow-scrolling:touch;}
.tierapp{flex:none;width:56px;text-align:center;cursor:grab;}
.tierapp .taicon{width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--card2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink-dim);font-size:18px;}
.tierapp .taicon img{width:100%;height:100%;object-fit:cover;}
.tierapp .tan{font-size:9.5px;color:var(--ink-dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.tierapp.dragging{opacity:.4;}
.tiercol.dragover{background:var(--teal-wash);border-radius:var(--r-sm);}
.oshislot{display:flex;gap:12px;}
.oshiitem{flex:1;text-align:center;background:var(--card2);border-radius:var(--r-sm);padding:14px 8px;border:1.5px dashed var(--line);}
.oshiitem .oi{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;background:#fff;border:2px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-faint);}
.oshiitem .oi img{width:100%;height:100%;object-fit:cover;}
.oshiitem .on2{font-size:12px;font-weight:700;color:var(--ink);}


#splashScreen{position:fixed;inset:0;z-index:9999;background:#e8e8ea;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s ease;}
#splashScreen img{width:100%;height:100%;object-fit:cover;object-position:center top;}
#splashScreen.hide{opacity:0;pointer-events:none;}
</style>

<div class="app">
  <header>
    <div class="brand"><div class="logo"><img id="brandLogo" alt=""></div><h1 id="brandTitle">くらしサポート</h1></div>
    <button class="gearbtn" id="gearBtn">⚙</button>
  </header>
  <main>
    <!-- 収支 -->
    <section class="view active" id="view-shuushi">
      <div id="budgetPopArea"></div>
      <div class="monthbar"><button class="mnav" id="prevM">‹</button><span class="mv" id="monthLabel">—</span><button class="mnav" id="nextM">›</button></div>
      <div class="msum" style="position:relative;overflow:visible;">
        <div class="mlab">2026年 の 差引</div>
        <div class="mbig plus" id="sumNet"><span class="yen">¥</span>0</div>
        <div class="mrow">
          <div class="mi"><div class="k">収入</div><div class="v in" id="sumIn"><span class="yen">¥</span>0</div></div>
          <div class="mi"><div class="k">支出</div><div class="v out" id="sumOut"><span class="yen">¥</span>0</div></div>
        </div>
      </div>
      <div id="ambSlot_shuushi_1" style="position:relative;height:60px;margin:-4px 0 10px;"></div>
      <div class="card calcard"><div class="calgrid" id="calGrid"></div></div>
      <div id="ambSlot_shuushi_2" style="position:relative;height:56px;margin:-4px 0 10px;"></div>
      <div class="card">
        <div class="daybar"><span class="d" id="dayLabel">—</span><span class="dn" id="dayNet"></span></div>
        <div id="dayList"></div>
      </div>
      <div id="ambSlot_shuushi_3" style="position:relative;height:56px;margin:10px 0 0;"></div>
    </section>
    <!-- 給与カウンター -->
    <section class="view" id="view-salary">
      <div class="salhero" style="position:relative;overflow:visible;">
        <div class="sl">今月の稼ぎ</div>
        <div class="sv"><span class="yen">¥</span><span id="salEarned">0</span></div>
        <div class="ssub" id="salSub">出勤 0 / 平日 0 日</div>
        <div class="streak"><span class="fireic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3-2 4-2 7a3 3 0 0 0 6 0c0-1-.5-2-1-2.5.5 2 -1 3-2 3-1.5 0-2-1.5-1-3C13 6 12.5 4.5 12 3z"/><path d="M8 13a4 4 0 0 0 8 0c0-2-1-3-1.5-4"/></svg></span><span class="sn" id="salStreak">0</span><span style="font-size:12px;opacity:.8">日連続</span></div>
      </div>
      <div id="ambSlot_salary_1" style="position:relative;height:64px;margin:-6px 0 10px;"></div>
      <button class="punchbtn" id="punchBtn">今日も出勤！</button>
      <div class="card">
        <div class="monthbar" style="margin-bottom:10px;"><button class="mnav" id="salPrevM">‹</button><span class="mv" id="salCalLabel" style="font-size:15px;">—</span><button class="mnav" id="salNextM">›</button></div>
        <h2>出勤カレンダー <span class="sub">タップで調整</span></h2><div class="calgrid salcal" id="salCalGrid"></div>
      </div>
      <div id="ambSlot_salary_2" style="position:relative;height:56px;margin:10px 0 0;"></div>
      <div class="card"><h2>給与条件</h2><div class="salinfo" id="salInfo"></div></div>
    </section>
    <!-- 相棒 -->
    <section class="view" id="view-companion" style="margin:-12px -14px 0;">
      <div class="companionwrap" id="companionImgHost"></div>
    </section>
    <!-- TODO -->
    <section class="view" id="view-todo">
      <div class="todotabs">
        <button class="on" data-todotab="plan">やること</button>
        <button data-todotab="wish">やりたいこと</button>
      </div>
      <div id="todoPlanPane">
        <div class="asobisum"><div class="k">これから遊びに必要なお金</div><div class="v" id="asobiTotal"><span class="yen">¥</span>0</div><div class="sub" id="asobiSub">予定を追加してみよう</div></div>
        <div id="ambSlot_todo_1" style="position:relative;height:60px;margin:-4px 0 10px;"></div>
        <div class="friendstrip" id="friendStrip"></div>
        <div id="planList"></div>
        <div id="ambSlot_todo_2" style="position:relative;height:56px;margin:10px 0 0;"></div>
      </div>
      <div id="todoWishPane" style="display:none;">
        <div id="wishList"></div>
        <button class="addbtn" id="wishAddBtn">＋ やりたいことを追加</button>
      </div>
    </section>
    <!-- アプリtier -->
    <section class="view" id="view-tier">
      <h2 style="font-size:12px;color:var(--ink-dim);letter-spacing:.06em;font-weight:800;margin:0 0 10px;padding:0 2px;">推しTIER</h2>
      <div class="tiercol S"><h3><span class="tbadge">S</span>殿堂</h3><div class="tierrow" id="tierRowS"></div></div>
      <div class="tiercol A"><h3><span class="tbadge">A</span>お気に入り</h3><div class="tierrow" id="tierRowA"></div></div>
      <div class="tiercol B"><h3><span class="tbadge">B</span>普通</h3><div class="tierrow" id="tierRowB"></div></div>
      <div class="tiercol C"><h3><span class="tbadge">C</span>低め</h3><div class="tierrow" id="tierRowC"></div></div>
      <div id="ambSlot_tier_1" style="position:relative;height:70px;margin:14px 0 4px;"></div>
      <div class="card" style="margin-top:10px;">
        <h2>アプリ一覧 <span class="sub">タップで詳細・アカウント</span></h2>
        <div id="appList"></div>
        <button class="addbtn" id="appAddBtn">＋ アプリを追加</button>
      </div>
      <p class="hint" style="text-align:center;">推しはアプリの詳細から追加できます</p>
    </section>
    <!-- 設定 -->
    <section class="view" id="view-set">
      <div class="card"><h2>データ <span class="sub">バックアップ推奨</span></h2>
        <button class="btn primary" id="exportBtn">⬇︎ バックアップを書き出す</button>
        <button class="btn ghost" id="importBtn">⬆︎ バックアップから復元</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
        <p class="hint">月1回JSONを書き出してiCloud等に保存すれば、機種変更しても復元できます。</p>
        <button class="btn danger" id="resetBtn">全データを初期化</button>
      </div>
      <p class="hint" style="text-align:center;">おかね × あそび × やること</p>
    </section>
  </main>

=\"1.3\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"18\" cy=\"12\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/>"}, "給与": {"c": "#00c853", "p": "<rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\"/><path d=\"M7 9v6M17 9v6\"/>"}, "賞与": {"c": "#ffab00", "p": "<path d=\"M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.5 7.1 18.2 8 12.7l-4-3.9L9.5 8z\"/>"}, "臨時": {"c": "#7c4dff", "p": "<circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v8M9.5 10a2.5 2 0 0 1 5 0c0 2-5 1-5 3a2.5 2 0 0 0 5 0\"/>"}};
const EXP_CATS=['食費','外食','日用品','交通費','趣味・娯楽','交際費','衣服・美容','医療','電気','ガス','水道','住居','通信','その他'];
const INC_CATS=['給与','賞与','臨時','その他'];
const pad2=n=>String(n).padStart(2,'0');
const YEN=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const NUM=n=>Math.round(n).toLocaleString('ja-JP');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const todayMonth=()=>todayStr().slice(0,7);
const MLABEL=m=>{const[y,mo]=m.split('-');return `${y}年${parseInt(mo)}月`;};
const addMonth=(m,d)=>{let[y,mo]=m.split('-').map(Number);mo+=d;while(mo<1){mo+=12;y--;}while(mo>12){mo-=12;y++;}return `${y}-${pad2(mo)}`;};
const daysInMonth=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate();};
const firstDow=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).getDay();};
const uid=()=>Math.random().toString(36).slice(2,10);
function rand(a){return a[Math.floor(Math.random()*a.length)];}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catColor=n=>(CATICONS[n]&&CATICONS[n].c)||'#94a3b8';
function catSvg(n,size){const d=CATICONS[n];const p=d?d.p:CATICONS['その他'].p;const col=d?d.c:'#94a3b8';return `<svg viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:${size||24}px;height:${size||24}px">${p}</svg>`;}

let db,state,curMonth=todayMonth(),selDate=todayStr();

function seed(){return{tx:{},plans:[],todos:[],accounts:[],friends:[],relations:[],wishes:[],apps:[],
  budget:budgetDefault(),salary:salaryDefault(),insightDismiss:''};}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE);r.onsuccess=e=>{db=e.target.result;res();};r.onerror=rej;});}
function load(){return new Promise(res=>{try{const t=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);}catch(e){res(null);}});}
function save(){try{db.transaction(STORE,'readwrite').objectStore(STORE).put(state,KEY);}catch(e){toast('保存に失敗');}}

// 取引: state.tx[YYYY-MM] = [{id,type:'in'|'out',amount,cat,memo,date}]
function monthTx(m){return state.tx[m]||[];}
function dayTx(dateStr){const m=dateStr.slice(0,7);return monthTx(m).filter(t=>t.date===dateStr);}
function monthSum(m){let inc=0,out=0;monthTx(m).forEach(t=>{if(t.type==='in')inc+=+t.amount||0;else out+=+t.amount||0;});return{inc,out,net:inc-out};}
function daySum(dateStr){let inc=0,out=0;dayTx(dateStr).forEach(t=>{if(t.type==='in')inc+=+t.amount||0;else out+=+t.amount||0;});return{inc,out,net:inc-out};}
function addTx(t){const m=t.date.slice(0,7);if(!state.tx[m])state.tx[m]=[];state.tx[m].push(t);save();}
function updateTx(t){const m=t.date.slice(0,7);// 日付が変わった場合は全月から除去して入れ直し
  removeTx(t.id);if(!state.tx[m])state.tx[m]=[];state.tx[m].push(t);save();}
function removeTx(id){Object.keys(state.tx).forEach(m=>{state.tx[m]=state.tx[m].filter(t=>t.id!==id);if(!state.tx[m].length)delete state.tx[m];});}

function haptic(){if(navigator.vibrate)navigator.vibrate(8);}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2000);}
function countUp(el,to,fmt){const dur=600,t0=performance.now();function step(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);el.innerHTML=fmt(to*e);if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}

/* 計算機の式評価 */
function evalAmount(str){if(str==null)return 0;let s=String(str).trim();if(s==='')return 0;
  s=s.replace(/[０-９]/g,d=>'0123456789'['０１２３４５６７８９'.indexOf(d)]).replace(/[＋]/g,'+').replace(/[－ー−]/g,'-').replace(/[×*✕]/g,'*').replace(/[÷／]/g,'/').replace(/[（]/g,'(').replace(/[）]/g,')').replace(/[，,、]/g,'').replace(/[¥￥\s]/g,'');
  if(/^-?\d+(\.\d+)?$/.test(s))return Math.round(parseFloat(s));
  if(!/^[0-9+\-*/().]+$/.test(s))return NaN;
  try{let i=0;
    function num(){let j=i;if(s[i]==='-'||s[i]==='+')i++;while(i<s.length&&/[0-9.]/.test(s[i]))i++;return parseFloat(s.slice(j,i));}
    function factor(){if(s[i]==='('){i++;let v=expr();if(s[i]===')')i++;return v;}return num();}
    function term(){let v=factor();while(s[i]==='*'||s[i]==='/'){const op=s[i++];const r=factor();v=op==='*'?v*r:v/r;}return v;}
    function expr(){let v=term();while(s[i]==='+'||s[i]==='-'){const op=s[i++];const r=term();v=op==='+'?v+r:v-r;}return v;}
    const r=expr();if(i!==s.length||isNaN(r)||!isFinite(r))return NaN;return Math.round(r);
  }catch(e){return NaN;}}

/* ===== 収支タブ ===== */
function renderShuushi(){
  document.getElementById('monthLabel').textContent=MLABEL(curMonth);
  const s=monthSum(curMonth);
  const mlab=document.querySelector('.msum .mlab');if(mlab)mlab.textContent=MLABEL(curMonth)+' の 差引';
  document.getElementById('sumIn').innerHTML='<span class="yen">¥</span>'+NUM(s.inc);
  document.getElementById('sumOut').innerHTML='<span class="yen">¥</span>'+NUM(s.out);
  const net=document.getElementById('sumNet');
  net.className='mbig '+(s.net<0?'minus':'plus');
  net.innerHTML='<span class="yen">¥</span>'+(s.net<0?'-':(s.net>0?'+':''))+NUM(Math.abs(s.net));
  renderCal();renderDay();
}
function renderCal(){
  const host=document.getElementById('calGrid');const dim=daysInMonth(curMonth),fd=firstDow(curMonth);
  let html='';['日','月','火','水','木','金','土'].forEach(w=>html+=`<div class="wd">${w}</div>`);
  for(let i=0;i<fd;i++)html+='<div class="cell empty"></div>';
  const tstr=todayStr();
  for(let d=1;d<=dim;d++){const ds=`${curMonth}-${pad2(d)}`;const dow=(fd+d-1)%7;const ds2=daySum(ds);
    const cls=['cell'];if(dow===0)cls.push('sun');if(dow===6)cls.push('sat');if(ds===tstr)cls.push('today');if(ds===selDate)cls.push('sel');
    let mk='';if(ds2.inc>0)mk+='<i class="in"></i>';if(ds2.out>0)mk+='<i class="out"></i>';
    html+=`<div class="${cls.join(' ')}" data-d="${ds}">${d}<div class="mk">${mk}</div></div>`;}
  host.innerHTML=html;
  host.querySelectorAll('.cell[data-d]').forEach(c=>c.onclick=()=>{selDate=c.dataset.d;haptic();renderCal();renderDay();});
}
function renderDay(){
  const dd=new Date(selDate+'T12:00:00');const wd=['日','月','火','水','木','金','土'][dd.getDay()];
  document.getElementById('dayLabel').textContent=`${dd.getMonth()+1}月${dd.getDate()}日(${wd})`;
  const s=daySum(selDate);const dn=document.getElementById('dayNet');
  if(s.inc||s.out){dn.innerHTML=(s.inc?`<span style="color:var(--green-deep)">+${NUM(s.inc)}</span>`:'')+(s.inc&&s.out?' / ':'')+(s.out?`<span style="color:var(--red)">-${NUM(s.out)}</span>`:'');}else dn.textContent='';
  const host=document.getElementById('dayList');const txs=dayTx(selDate);
  if(!txs.length){host.innerHTML='<div class="empty">この日の記録はまだありません<br>右下の＋から追加できます</div>';return;}
  host.innerHTML='';
  txs.slice().sort((a,b)=>a.type===b.type?0:a.type==='in'?-1:1).forEach(t=>{
    const isIn=t.type==='in';const col=catColor(t.cat);
    const row=document.createElement('div');row.className='txrow';
    row.innerHTML=`<div class="txic" style="background:${col}1a">${catSvg(t.cat,22)}</div>
      <div class="nm">${esc(t.memo||t.cat)}<small>${esc(t.cat)}</small></div>
      <div class="amt ${isIn?'in':'out'}">${isIn?'+':'-'}${YEN(t.amount)}</div>`;
    row.onclick=()=>openTx(t);host.appendChild(row);});
}

/* ===== モーダル基盤 ===== */
const modal=document.getElementById('modal'),sheet=document.getElementById('sheet');
function closeModal(){modal.classList.remove('open');}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
function openSheet(html){sheet.innerHTML='<div class="grip"></div>'+html;modal.classList.add('open');}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

/* ===== 取引入力（電卓UI） ===== */
let calcBuf='';   // 入力中の式
let txDraft=null; // {id,type,amount,cat,memo,date}
function openTx(item){
  const isNew=!item;
  txDraft=item?{...item}:{id:uid(),type:'out',amount:0,cat:'食費',memo:'',date:selDate};
  if(isNew)txDraft.date=selDate;
  calcBuf=item?String(item.amount):'';
  drawTxSheet(isNew);
}
function drawTxSheet(isNew){
  const t=txDraft;const cats=t.type==='in'?INC_CATS:EXP_CATS;
  if(!cats.includes(t.cat))t.cat=cats[0];
  const dd=new Date(t.date+'T12:00:00');const wd=['日','月','火','水','木','金','土'][dd.getDay()];
  let tiles='';cats.forEach(c=>{tiles+=`<div class="cattile ${t.cat===c?'on':''}" data-cat="${esc(c)}"><div class="ci">${catSvg(c,26)}</div><div class="cn">${esc(c)}</div></div>`;});
  const disp=calcDisplay();
  openSheet(`
    <div class="segbig">
      <button class="${t.type==='out'?'on exp':''}" data-type="out">支出</button>
      <button class="${t.type==='in'?'on inc':''}" data-type="in">収入</button>
    </div>
    <div class="datepick"><button id="dPrev">‹</button><span class="dv" id="dVal">${dd.getFullYear()}年${dd.getMonth()+1}月${dd.getDate()}日(${wd})</span><button id="dNext">›</button></div>
    <div class="field" style="margin-bottom:12px;"><input id="tx_memo" placeholder="メモ（任意）" value="${esc(t.memo||'')}"></div>
    <div class="amtdisp"><span class="yen">¥</span><span class="n ${disp.ph?'ph':''}" id="amtN">${disp.text}</span></div>
    <div class="calceq" id="calcEq"></div>
    <div class="cattiles">${tiles}</div>
    <div class="calcpad">
      <div class="calctax"><button data-tax="1.08">税込8%</button><button data-tax="1.1">税込10%</button></div>
      <div class="calcgrid">
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="/">÷</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="*">×</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="-">−</button>
        <button class="fn" data-k="AC">AC</button><button data-k="0">0</button><button data-k="00">00</button><button class="op" data-k="+">＋</button>
      </div>
      <div class="calcgrid" style="margin-top:8px;">
        <button class="fn" data-k="DEL" style="grid-column:span 3;">⌫ 一文字消す</button>
        <button class="ok" id="txOK" style="grid-row:span 1;">${isNew?'追加':'保存'}</button>
      </div>
      ${isNew?'':'<button class="btn danger" id="txDel" style="margin-top:12px;">この記録を削除</button>'}
    </div>
  `);
  // type切替
  sheet.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{txDraft.type=b.dataset.type;const cs=txDraft.type==='in'?INC_CATS:EXP_CATS;if(!cs.includes(txDraft.cat))txDraft.cat=cs[0];haptic();drawTxSheet(isNew);});
  // 日付
  document.getElementById('dPrev').onclick=()=>{shiftDraftDate(-1);drawTxSheet(isNew);};
  document.getElementById('dNext').onclick=()=>{shiftDraftDate(1);drawTxSheet(isNew);};
  // カテゴリ
  sheet.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{txDraft.cat=el.dataset.cat;haptic();sheet.querySelectorAll('.cattile').forEach(x=>x.classList.toggle('on',x===el));});
  // 電卓
  sheet.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>calcKey(b.dataset.k));
  sheet.querySelectorAll('[data-tax]').forEach(b=>b.onclick=()=>applyTax(+b.dataset.tax));
  document.getElementById('tx_memo').oninput=e=>{txDraft.memo=e.target.value;};
  document.getElementById('txOK').onclick=commitTx;
  const del=document.getElementById('txDel');if(del)del.onclick=()=>{removeTx(txDraft.id);save();haptic();closeModal();renderShuushi();toast('削除しました');};
  updateCalcEq();
}
function shiftDraftDate(d){const dt=new Date(txDraft.date+'T12:00:00');dt.setDate(dt.getDate()+d);txDraft.date=`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;haptic();}
function calcDisplay(){if(calcBuf==='')return{text:'0',ph:true};const v=evalAmount(calcBuf);if(!isNaN(v)&&!/[+\-*/]$/.test(calcBuf)&&!/[+\-*/]/.test(calcBuf))return{text:NUM(v),ph:false};return{text:esc(calcBuf.replace(/\*/g,'×').replace(/\//g,'÷')),ph:false};}
function updateAmtDisp(){const d=calcDisplay();const el=document.getElementById('amtN');if(el){el.textContent=d.text;el.classList.toggle('ph',d.ph);}}
function updateCalcEq(){const eq=document.getElementById('calcEq');if(!eq)return;if(/[+\-*/]/.test(calcBuf)){const v=evalAmount(calcBuf);eq.innerHTML=isNaN(v)?'':'= <b>'+YEN(v)+'</b>';}else eq.innerHTML='';}
function calcKey(k){
  if(k==='AC')calcBuf='';
  else if(k==='DEL')calcBuf=calcBuf.slice(0,-1);
  else if(/[+\-*/]/.test(k)){if(calcBuf===''&&k!=='-')return;if(/[+\-*/]$/.test(calcBuf))calcBuf=calcBuf.slice(0,-1)+k;else calcBuf+=k;}
  else calcBuf+=k;
  haptic();updateAmtDisp();updateCalcEq();
}
function applyTax(rate){const v=evalAmount(calcBuf);if(isNaN(v)||v<=0){toast('先に金額を入れてね');return;}calcBuf=String(Math.round(v*rate));haptic();updateAmtDisp();updateCalcEq();toast('税込'+(rate===1.08?'8%':'10%')+'で計算');}
function commitTx(){
  const amt=evalAmount(calcBuf);
  if(isNaN(amt)||amt<=0){toast('金額を確認してね');return;}
  txDraft.amount=amt;
  const exists=Object.values(state.tx).some(arr=>arr.some(x=>x.id===txDraft.id));
  if(exists)updateTx(txDraft);else addTx(txDraft);
  selDate=txDraft.date;curMonth=txDraft.date.slice(0,7);
  haptic();closeModal();renderShuushi();toast('記録しました');
}

function renderAsobi(){
  renderFriendStrip();
  const plans=(state.plans||[]).slice();
  const pending=plans.filter(p=>!p.done);
  const total=pending.reduce((s,p)=>s+(+p.cost||0),0);
  countUp(document.getElementById('asobiTotal'),total,v=>'<span class="yen">¥</span>'+NUM(v));
  document.getElementById('asobiSub').textContent=pending.length?`予定 ${pending.length}件ぶんの用意が必要`:'予定を追加してみよう';
  const host=document.getElementById('planList');host.innerHTML='';
  if(!plans.length){host.innerHTML='<div class="empty" style="padding:40px 0;">まだ予定がありません<br>右下の＋から追加しよう</div>';return;}
  plans.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;return (a.date||'9999')<(b.date||'9999')?-1:1;});
  plans.forEach(p=>{
    const dd=p.date?new Date(p.date+'T12:00:00'):null;
    const row=document.createElement('div');row.className='plan'+(p.done?' done':'');
    const rids=(p.relIds||[]).map(id=>relById(id)).filter(Boolean);
    let faces='';if(rids.length){faces='<div class="pfaces">'+rids.slice(0,4).map(r=>relAvatar(r,24)).join('')+(rids.length>4?`<span class="pmore">+${rids.length-4}</span>`:'')+'</div>';}
    const meta=[];const whoName=rids.length?rids.map(r=>r.name).join('・'):(p.who||'');if(whoName)meta.push(`<span>${esc(whoName)}</span>`);if(p.where)meta.push(`<span>📍 ${esc(p.where)}</span>`);

/* ===== 生活費予算(食費/タバコ/日用品) ===== */
function budgetDefault(){return{
  food:{limit:1000, lastCarry:0, history:{}}, // history[date]=金額
  cig:{limit:600, lastBoughtDate:null, history:{}},
  daily:{limit:10000, history:{}} // history[month]=金額
};}
function todayLimit_food(){const b=state.budget.food;const carry=b.lastCarry||0;return Math.max(0,b.limit-carry);}
function recordFood(amount,date){const b=state.budget.food;const day=date||todayStr();
  b.history[day]=(b.history[day]||0)+amount;
  const limitToday=todayLimit_food();
  const over=b.history[day]-limitToday;
  b.lastCarry = over>0? over : 0;
  save();
  return over>0?over:0;
}
function needFoodPopupToday(){const t=todayStr();return !(state.budget.food.history[t]!=null);}
function cigDaysSince(){const last=state.budget.cig.lastBoughtDate;if(!last)return 99;const d1=new Date(last+'T12:00:00'),d2=new Date(todayStr()+'T12:00:00');return Math.round((d2-d1)/86400000);}
function needCigPopupToday(){return cigDaysSince()>=2;}
function recordCig(amount){state.budget.cig.lastBoughtDate=todayStr();state.budget.cig.history[todayStr()]=amount;save();}
function dailyGoodsDueDate(){ // 15日、土日ならその前の平日
  const [y,mo]=curMonthReal().split('-').map(Number);
  let d=new Date(y,mo-1,15);
  while(d.getDay()===0||d.getDay()===6){d.setDate(d.getDate()-1);}
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function curMonthReal(){return todayMonth();}
function needDailyGoodsPopupToday(){const due=dailyGoodsDueDate();const t=todayStr();if(t!==due)return false;const m=t.slice(0,7);return !(state.budget.daily.history[m]!=null);}
function recordDailyGoods(amount){const m=todayMonth();state.budget.daily.history[m]=amount;save();}

/* ===== 給与カウンター ===== */
function salaryDefault(){return{monthly:357850, closingDay:25, payDay:15, worked:{}};}
function salCycle(){const cd=state.salary.closingDay||25;const t=new Date();let y=t.getFullYear(),mo=t.getMonth(),d=t.getDate();let endY=y,endM=mo;if(d>cd){endM++;if(endM>11){endM=0;endY++;}}const start=new Date(endY,endM-1,cd+1);const end=new Date(endY,endM,cd);return{start,end};}
function salWeekdays(){const c=salCycle();let cnt=0;const d=new Date(c.start);while(d<=c.end){const w=d.getDay();if(w!==0&&w!==6)cnt++;d.setDate(d.getDate()+1);}return cnt;}
function salWorkedCount(){const w=state.salary.worked||{};const c=salCycle();let cnt=0;Object.keys(w).forEach(k=>{if(w[k]){const d=new Date(k+'T12:00:00');if(d>=c.start&&d<=c.end)cnt++;}});return cnt;}
function salDailyWage(){const wd=salWeekdays();return wd>0?state.salary.monthly/wd:0;}
function salEarned(){return salDailyWage()*salWorkedCount();}
function salStreak(){const w=state.salary.worked||{};const d=new Date();let streak=0;for(let i=0;i<400;i++){const dow=d.getDay();if(dow!==0&&dow!==6){const key=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;if(w[key])streak++;else break;}d.setDate(d.getDate()-1);}return streak;}
